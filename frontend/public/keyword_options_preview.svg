<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FEFCE8; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #064E3B; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #4B6358; }
      .card-bg { fill: #FFFFFF; stroke: #E2E8D0; stroke-width: 1.5; }
      .card-header-bar { fill: #FEF9C3; }
      .opt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #064E3B; letter-spacing: 0.04em; }
      .opt-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #047857; font-weight: 600; }
      .badge-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #064E3B; }
      .doc-count { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #4D6B5D; }
      .topic-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #064E3B; }
      .cluster-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #64748B; }
      .sec-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; fill: #4B6358; letter-spacing: 0.06em; }
      .kw-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #064E3B; font-weight: 600; }
      .kw-score { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #064E3B; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" class="bg" />

  <!-- Master Header -->
  <g transform="translate(40, 42)">
