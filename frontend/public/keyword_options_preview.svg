    <text x="0" y="22" class="header-sub">Eliminates horizontal bar charts in favor of modern, data-dense executive micro-visualizations</text>
  </g>

  <!-- ======================================================== -->
  <!-- OPTION A: SEMANTIC TAG CHIPS / BADGES                    -->
  <!-- ======================================================== -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <!-- Card Base -->
    <rect width="360" height="395" rx="8" class="card-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 38 L 0 38 Z" class="card-header-bar" />
    <text x="16" y="24" class="opt-label">OPTION A: TAG CHIPS / BADGES</text>
    <text x="344" y="24" text-anchor="end" class="opt-desc">Recommended</text>

