      <text x="0" y="44" class="topic-title">AI &amp; Deep Learning Models</text>
      <text x="0" y="60" class="cluster-id">Cluster ID: 4_ai</text>

      <!-- Section Label -->
      <text x="0" y="88" class="sec-label">KEY DISCUSSION KEYWORDS</text>

      <!-- Chips Flow Grid (Zero Bars) -->
      <g transform="translate(0, 100)">
        <!-- Row 1 -->
        <g transform="translate(0, 0)">
          <rect width="154" height="32" rx="6" fill="#FEFCE8" stroke="#064E3B" stroke-width="1.2" />
          <text x="14" y="20" class="kw-text">ai</text>
          <rect x="98" y="6" width="46" height="20" rx="4" fill="#064E3B" />
          <text x="121" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FEFCE8">0.16</text>
        </g>

        <g transform="translate(164, 0)">
          <rect width="160" height="32" rx="6" fill="#FEFCE8" stroke="#047857" stroke-width="1.2" />
          <text x="14" y="20" class="kw-text">media</text>
          <rect x="104" y="6" width="46" height="20" rx="4" fill="#047857" />
          <text x="127" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FEFCE8">0.11</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 42)">
          <rect width="154" height="32" rx="6" fill="#FEFCE8" stroke="#0D9488" stroke-width="1.2" />
          <text x="14" y="20" class="kw-text">social</text>
          <rect x="98" y="6" width="46" height="20" rx="4" fill="#0D9488" />
          <text x="121" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FEFCE8">0.09</text>
        </g>

        <g transform="translate(164, 42)">
          <rect width="160" height="32" rx="6" fill="#FEFCE8" stroke="#2D6A4F" stroke-width="1.2" />
          <text x="12" y="20" class="kw-text">social media</text>
          <rect x="104" y="6" width="46" height="20" rx="4" fill="#2D6A4F" />
          <text x="127" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FEFCE8">0.09</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 84)">
          <rect width="154" height="32" rx="6" fill="#FEFCE8" stroke="#CBD5B8" stroke-width="1.2" />
          <text x="14" y="20" class="kw-text">data</text>
          <rect x="98" y="6" width="46" height="20" rx="4" fill="#4B6358" />
          <text x="121" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FEFCE8">0.05</text>
        </g>
