          <circle cx="180" cy="12" r="5" fill="#0D9488" />
          <circle cx="200" cy="12" r="5" fill="#0D9488" />
          <circle cx="220" cy="12" r="5" fill="#E2E8D0" />
          <circle cx="240" cy="12" r="5" fill="#E2E8D0" />
          <text x="324" y="16" text-anchor="end" class="kw-score">0.09</text>
          <line x1="0" y1="26" x2="324" y2="26" stroke="#FEF9C3" stroke-width="1" />
