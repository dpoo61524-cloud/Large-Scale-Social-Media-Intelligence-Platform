          <circle cx="16" cy="11" r="10" fill="none" stroke="#0D9488" stroke-width="3" stroke-dasharray="34 63" transform="rotate(-90 16 11)" />
          <text x="38" y="16" class="kw-text">social media</text>
          <text x="324" y="16" text-anchor="end" class="kw-score">0.09</text>
