      <rect x="0" y="255" width="324" height="36" rx="5" fill="#FEF9C3" stroke="#E2E8D0" />
      <text x="10" y="272" font-family="sans-serif" font-size="10" fill="#064E3B" font-weight="600">
        Clean semantic badges. No bar charts. High contrast tags
      </text>
      <text x="10" y="284" font-family="sans-serif" font-size="9.5" fill="#4B6358">
        emphasizing keywords with bold dark green score pills.
      </text>
