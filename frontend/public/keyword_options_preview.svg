          <text x="38" y="16" class="kw-text">ai</text>
          <text x="324" y="16" text-anchor="end" class="kw-score">0.16</text>
          <line x1="0" y1="26" x2="324" y2="26" stroke="#FEF9C3" stroke-width="1" />
